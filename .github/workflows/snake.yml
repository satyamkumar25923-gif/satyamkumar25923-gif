name: Blue Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate Blue Snake
        uses: Platane/snk@v3
        with:
          github_user_name: satyamkumar25923-gif
          outputs: |
            dist/github-contribution-grid-snake-blue.svg?color_snake=%2360A5FA&color_dots=%230B1F3A,%23164A7A,%231E6FAF,%232F80ED,%2360A5FA
            dist/github-contribution-grid-snake-blue-dark.svg?color_snake=%2360A5FA&color_dots=%230B1F3A,%23164A7A,%231E6FAF,%232F80ED,%2360A5FA

      - name: Deploy Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
